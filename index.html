<script>

{ name: "超神回サバイバル・シェルター", desc: "驚異の超高額設定！選ばれた者だけが味わえる至高の神回ゾーン。" },

{ name: "新世紀ハイエンド・コア", desc: "1タップで超大金が動く、YouTube撮影に最高の奇跡の神引き台。" }
],
rare: [
{ name: "激レアセレクト・ステーション", desc: "めったにお目にかかれない、レアな高級ドリンクだけを集めた限定台。" },
{ name: "極みリッチアロマ・パレット", desc: "ワンランク上のプレミアムな味わいと、ハイクラスな価格帯の融合。" }
],
chill: [
{ name: "チル系レイジー・スポット", desc: "お財布に最高に優しい、のんびりサクサク進めるための癒やし台。" },
{ name: "コンフォート・リラックスBOX", desc: "ワンコイン未満の激安プライス。在庫を瞬殺してコンボを繋げ！" }
],
normal: [
{ name: "王道スタンダード・ベンダー", desc: "私たちが街中でいつも見かける、親しみやすさ抜群の定番モデル。" },
{ name: "いつもの日常リフレッシュ", desc: "安心・安全の標準価格。プレーンで安定した立ち回りが可能。" }
],
hazard: [
{ name: "世紀末サバイバル・シェルター", desc: "ハザード：100%完全連動の1円〜50,000円…" },
{ name: "危険領域ハザード・コア", desc: "1円のゴミ値から一撃50,000円までがゴチャ混ぜの最凶ギャンブル台。" }
]
};
const drinkInventory = ["🥤","🍵","☕","🍊","🍎","🍋","🍇","🍓","🍈","🍍","🍅","🍌","🥛","🍼","🍯","🧊","🍹","🍉","🍏","🍑","🍒","🥝","🧃"];
let sales=0, inserted=0, combo=0, comboTimer=null, currentStocks=[], currentPrices=[], currentSlotsData=[], initialStocks=[], audioCtx=null, isMuted=false, droppedItems=[], pricePatternSeed=0;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function toggleMute() { isMuted = !isMuted; document.getElementById('audioBtn').innerText = isMuted ? "🔇" : "🔊"; }
function playSound(type, freqMod = 0) {
if (isMuted) return; initAudio(); if (!audioCtx) return;
try {
const osc = audioCtx.createOscillator(), gain = audioCtx.createGain(); osc.connect(gain); gain.connect(audioCtx.destination);
if (type === 'coin') { osc.type = 'sine'; osc.frequency.setValueAtTime(850 + freqMod, audioCtx.currentTime); gain.gain.setValueAtTime(0.06, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.005, audioCtx.currentTime + 0.12); osc.start(); osc.stop(audioCtx.currentTime + 0.12); }
else if (type === 'buy') { osc.type = 'triangle'; osc.frequency.setValueAtTime(380 + freqMod, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(160 + freqMod, audioCtx.currentTime + 0.18); gain.gain.setValueAtTime(0.12, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.005, audioCtx.currentTime + 0.18); osc.start(); osc.stop(audioCtx.currentTime + 0.18); }
else if (type === 'error') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(110, audioCtx.currentTime); gain.gain.setValueAtTime(0.08, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.005, audioCtx.currentTime + 0.15); osc.start(); osc.stop(audioCtx.currentTime + 0.15); }
else if (type === 'clear') { [523.25, 659.25, 783.99, 1046.50, 1318.51].forEach((f, i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.08); g.gain.setValueAtTime(0.05, i * 0.08); g.gain.exponentialRampToValueAtTime(0.005, i * 0.08 + 0.25); o.start(i * 0.08); o.stop(i * 0.08 + 0.25); }); }
else if (type === 'shuffle') { osc.type = 'sine'; osc.frequency.setValueAtTime(200, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.2); gain.gain.setValueAtTime(0.05, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.005, audioCtx.currentTime + 0.2); osc.start(); osc.stop(audioCtx.currentTime + 0.2); }
} catch(e) {}
}
function applyVendingDesign(type, index) {
let glowColor = "#a855f7", attrLabel = "通常系", labelColor = "#3b82f6";
if (type === 'super_god') { glowColor = "#eab308"; attrLabel = "超神回"; labelColor = "#facc15"; }
else if (type === 'rare') { glowColor = "#ec4899"; attrLabel = "激レア"; labelColor = "#f472b6"; }
else if (type === 'chill') { glowColor = "#14b8a6"; attrLabel = "チル系"; labelColor = "#2dd4bf"; }
else if (type === 'normal') { glowColor = "#3b82f6"; attrLabel = "通常系"; labelColor = "#60a5fa"; }
else if (type === 'hazard') { glowColor = "#ef4444"; attrLabel = "ハザード"; labelColor = "#f87171"; }
document.documentElement.style.setProperty('--neon-glow', glowColor); return { label: attrLabel, color: labelColor };
}
function getBoundedRandom(min, max, step = 10) { const val = Math.floor(Math.random() * (max - min + 1) + min); return step === 1 ? val : Math.round(val / step) * step; }
function generate50PatternPrices(type, patternId) {
let prices = [], min = 100, max = 300, isHazard = false;
if (type === 'super_god') { min = 3000; max = 19800; } else if (type === 'rare') { min = 1000; max = 9900; } else if (type === 'chill') { min = 10; max = 99; } else if (type === 'normal') { min = 100; max = 300; } else if (type === 'hazard') { min = 1; max = 50000; isHazard = true; }
const step = isHazard ? 1 : 10; const mod = patternId % 5; let cachedPrice = getBoundedRandom(min, max, step);

else if (mod === 1) prices.push(cachedPrice);
else if (mod === 2) { const chunk = (max - min) / 8; prices.push(getBoundedRandom(Math.floor(min + chunk * i), Math.floor(min + chunk * (i + 1)), step)); }
else if (mod === 3) { if (i === patternId % 8) prices.push(max); else prices.push(getBoundedRandom(min, Math.floor(min + (max - min) * 0.15), step)); }
else { if (i < 4) prices.push(getBoundedRandom(min, Math.floor(min + (max - min) * 0.3), step)); else prices.push(getBoundedRandom(Math.floor(max - (max - min) * 0.3), max, step)); }

}
function initVendingMachine() {
const attrKeys = ['super_god', 'rare', 'chill', 'normal', 'hazard'];
const currentAttr = attrKeys[Math.floor(Math.random() * attrKeys.length)];
const pool = namesPool[currentAttr]; const data = pool[Math.floor(Math.random() * pool.length)] || pool;
const nameIndex = Math.floor(Math.random() * 50); pricePatternSeed = Math.floor(Math.random() * 50);
const designInfo = applyVendingDesign(currentAttr, nameIndex);
document.getElementById('bannerTitle').innerHTML = `<span style="color:${designInfo.color}; font-weight:bold;">[${designInfo.label}]</span> ${data.name}`;
document.getElementById('bannerDesc').innerText = data.desc;
const totalStock = Math.floor(Math.random() * (500 - 50 + 1) + 50);
currentSlotsData = [...drinkInventory].sort(() => 0.5 - Math.random()).slice(0, 8);
currentStocks = []; initialStocks = []; currentPrices = generate50PatternPrices(currentAttr, pricePatternSeed);
let remainingStock = totalStock;
for (let i = 0; i < 8; i++) {
if (i === 7) { currentStocks.push(Math.max(1, remainingStock)); initialStocks.push(Math.max(1, remainingStock)); }
else { let share = Math.floor(Math.random() * (remainingStock / 1.5)); if (share < 1) share = 1; currentStocks.push(share); initialStocks.push(share); remainingStock -= share; }
}
document.getElementById('clearMessagePanel').style.display = 'none'; document.getElementById('giantResultPanel').style.display = 'none';
document.getElementById('soldoutIndicator').classList.remove('active'); droppedItems = [];
const chute = document.getElementById('chute'); chute.innerHTML = '<div class="chute-label" id="chuteLabel">商品排出口</div>';

}
function insertMoney(amount) { if (currentStocks.every(s => s === 0)) return; inserted += amount; playSound('coin'); updateUI(); }
function triggerCombo() {
combo++; clearTimeout(comboTimer); document.getElementById('comboCount').innerText = combo;
const bonus = combo * 10; document.getElementById('comboBonusText').innerText = `+¥${bonus}`; document.getElementById('comboBonusText').style.display = 'inline-block';
const comboBlock = document.getElementById('comboBlock'); comboBlock.classList.remove('combo-bounce'); void comboBlock.offsetWidth; comboBlock.classList.add('combo-bounce');
if (combo >= 10) comboBlock.classList.add('fever');
comboTimer = setTimeout(() => { combo = 0; document.getElementById('comboCount').innerText = "0"; document.getElementById('comboBonusText').style.display = 'none'; comboBlock.classList.remove('fever'); }, 1500);

}
function clickSlot(index) {
const price = currentPrices[index]; if (inserted < price || currentStocks[index] <= 0) { playSound('error'); return; }
currentStocks[index]--; inserted -= price; const bonus = triggerCombo(); sales += (price + bonus); playSound('buy', combo * 15);
const readyLamp = document.getElementById('readyLamp'); readyLamp.innerText = "購入ThankYou"; readyLamp.className = "status-lamp-val active";
setTimeout(() => { readyLamp.innerText = inserted > 0 ? "稼働" : "待機"; readyLamp.className = inserted > 0 ? "status-lamp-val active" : "status-lamp-val"; }, 800);
droppedItems.push(currentSlotsData[index]); const chute = document.getElementById('chute'); chute.innerHTML = '';
if (document.getElementById('chuteLabel')) document.getElementById('chuteLabel').style.opacity = '0';
droppedItems.forEach(emoji => { const span = document.createElement('span'); span.className = 'item-dropped'; span.innerText = emoji; chute.appendChild(span); });
renderShowcase(); updateUI(); if (currentStocks.every(s => s === 0)) handleClearVending();
}
function updateUI() {
document.getElementById('insertedMoney').innerText = inserted.toLocaleString();
document.getElementById('readyLamp').innerText = inserted > 0 ? "稼働" : "待機";
document.getElementById('readyLamp').className = inserted > 0 ? "status-lamp-val active" : "status-lamp-val";
document.querySelectorAll('.drink-slot').forEach((slot, idx) => {
const price = currentPrices[idx], isOut = currentStocks[idx] === 0, insufficientLabel = slot.querySelector('.insufficient-lbl');
if (isOut) { slot.classList.remove('locked'); slot.classList.add('out-of-stock'); if (insufficientLabel) insufficientLabel.style.visibility = 'hidden'; }
else if (inserted < price) { slot.classList.add('locked'); slot.classList.remove('out-of-stock'); if (insufficientLabel) insufficientLabel.style.visibility = 'visible'; }
else { slot.classList.remove('locked'); slot.classList.remove('out-of-stock'); if (insufficientLabel) insufficientLabel.style.visibility = 'hidden'; }
});
}
function renderShowcase() {
const showcase = document.getElementById('showcase'); showcase.innerHTML = '';
currentSlotsData.forEach((emoji, i) => {
const stock = currentStocks[i], price = currentPrices[i], isSoldOut = stock === 0, slot = document.createElement('div');
slot.className = `drink-slot`; slot.setAttribute('onclick', `clickSlot(${i})`);
slot.innerHTML = `<div class="drink-img" style="${isSoldOut ? 'opacity:0.15;' : ''}">${isSoldOut ? '⬜' : emoji}</div><div class="price-container"><div class="price-lbl">${isSoldOut ? '売切' : '¥' + price.toLocaleString()}</div><div class="insufficient-lbl">￥不足</div></div>`;
showcase.appendChild(slot);
});
}
function handleClearVending() {
playSound('clear'); document.getElementById('soldoutIndicator').classList.add('active'); document.getElementById('clearMessagePanel').style.display = 'block';
const giantPanel = document.getElementById('giantResultPanel'), giantBtn = document.getElementById('giantNextBtn');
giantBtn.innerText = `¥${sales.toLocaleString()} 獲得！\n次の自販機へ`; giantPanel.style.display = 'block';
}
function manualShuffle() { playSound('shuffle'); sales = 0; inserted = 0; initVendingMachine(); }
function goToNextMachine() { sales = 0; inserted = 0; initVendingMachine(); }
window.onload = () => { initVendingMachine(); };
</script>
</body>
</html>
